<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="만세력 고서와 서안(책상) 일러스트 시안">
  <rect width="800" height="540" fill="#f3ede0" />
  <rect x="20" y="20" width="760" height="500" rx="8" fill="none" stroke="#9e8f75" stroke-width="1.5" />

  <!-- 전통 원목 서안(책상) -->
  <rect x="90" y="320" width="620" height="28" rx="4" fill="#5a3e28" />
  <rect x="130" y="348" width="24" height="130" fill="#462f1d" />
  <rect x="646" y="348" width="24" height="130" fill="#462f1d" />
  <rect x="154" y="375" width="492" height="14" fill="#462f1d" />

  <!-- 펼쳐진 만세력 서책 -->
  <g transform="translate(210, 215)">
    <rect x="0" y="0" width="220" height="105" rx="3" fill="#fcfaf2" stroke="#8c7b60" stroke-width="2" />
    <line x1="110" y1="0" x2="110" y2="105" stroke="#b6ab96" stroke-width="1.5" />
    <line x1="35" y1="18" x2="35" y2="88" stroke="#d8d0c1" stroke-width="1" />
    <line x1="65" y1="18" x2="65" y2="88" stroke="#d8d0c1" stroke-width="1" />
    <line x1="145" y1="18" x2="145" y2="88" stroke="#d8d0c1" stroke-width="1" />
    <line x1="175" y1="18" x2="175" y2="88" stroke="#d8d0c1" stroke-width="1" />
    <text x="50" y="55" text-anchor="middle" fill="#1c1b18" font-family="AppleMyungjo, serif" font-size="18" font-weight="700">萬歲曆</text>
    <text x="160" y="55" text-anchor="middle" fill="#1f4738" font-family="AppleMyungjo, serif" font-size="16" font-weight="700">四柱命式</text>
  </g>

  <!-- 벼루와 먹, 붓꽂이 -->
  <rect x="475" y="285" width="85" height="35" rx="6" fill="#2c2b29" />
  <ellipse cx="517" cy="298" rx="28" ry="8" fill="#141413" />
  <line x1="540" y1="225" x2="505" y2="295" stroke="#6b4c35" stroke-width="6" stroke-linecap="round" />
  <path d="M 505 295 Q 498 305 492 303 Q 496 293 505 295 Z" fill="#1c1b18" />

  <!-- 상단 캡션 -->
  <text x="60" y="78" fill="#1c1b18" font-family="AppleMyungjo, serif" font-size="24" font-weight="700">서재와 만세력 연구 공간 (시안)</text>
  <text x="60" y="108" fill="#5c574f" font-family="Apple SD Gothic Neo, sans-serif" font-size="15">출생 시각과 절입 경계를 대조하여 서면 풀이를 정리하는 연구 책상 시안</text>
</svg>
