<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="전통 창호와 다실 공간 일러스트 시안">
  <rect width="800" height="540" fill="#efe8d8" />
  <rect x="20" y="20" width="760" height="500" rx="8" fill="none" stroke="#9e8f75" stroke-width="1.5" />

  <!-- 한지 격자 창호와 햇살 -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="360" height="240" fill="#fbf8f1" stroke="#6e5239" stroke-width="6" />
    <line x1="180" y1="0" x2="180" y2="240" stroke="#6e5239" stroke-width="5" />
    <line x1="90" y1="0" x2="90" y2="240" stroke="#8c6d53" stroke-width="2" />
    <line x1="270" y1="0" x2="270" y2="240" stroke="#8c6d53" stroke-width="2" />
    <line x1="0" y1="80" x2="360" y2="80" stroke="#8c6d53" stroke-width="2" />
    <line x1="0" y1="160" x2="360" y2="160" stroke="#8c6d53" stroke-width="2" />
    <!-- 창문 너머 대나무 그림자 -->
    <path d="M 290 235 Q 305 140 335 45" stroke="#1f4738" stroke-width="4" stroke-opacity="0.35" fill="none" />
    <ellipse cx="320" cy="95" rx="22" ry="6" transform="rotate(-25 320 95)" fill="#1f4738" fill-opacity="0.3" />
    <ellipse cx="295" cy="135" rx="22" ry="6" transform="rotate(20 295 135)" fill="#1f4738" fill-opacity="0.3" />
  </g>

  <!-- 다탁과 다관(찻주전자)·찻잔 -->
  <rect x="240" y="390" width="320" height="18" rx="3" fill="#5a3e28" />
  <rect x="270" y="408" width="16" height="55" fill="#462f1d" />
  <rect x="514" y="408" width="16" height="55" fill="#462f1d" />

  <ellipse cx="365" cy="372" rx="32" ry="20" fill="#3a5a4b" />
  <rect x="353" y="346" width="24" height="6" rx="3" fill="#284035" />
  <path d="M 395 370 Q 415 360 420 352" stroke="#3a5a4b" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M 333 364 Q 315 364 318 378 Q 322 385 335 380" stroke="#3a5a4b" stroke-width="4" fill="none" />

  <rect x="445" y="370" width="28" height="20" rx="4" fill="#fcfaf2" stroke="#8c7b60" stroke-width="1.5" />

  <text x="60" y="62" fill="#1c1b18" font-family="AppleMyungjo, serif" font-size="22" font-weight="700">차분한 사유와 정돈의 공간 (시안)</text>
</svg>
